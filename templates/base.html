<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI BI Dashboard{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">

    <!-- Anti-flash theme init (must run before any CSS renders) -->
    <script>
        (function () {
            var saved = localStorage.getItem('mx-theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            }
        })();
    </script>

    <!-- CSS -->
    <link href="/static/css/theme.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/main.css" rel="stylesheet">
    <link href="/static/css/components.css" rel="stylesheet">
    <link href="/static/css/jobs.css" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- 3D Organic Flow Canvas -->
    <canvas id="nexus-flow-canvas"></canvas>

    <!-- Sidebar -->
    {% include 'components/sidebar.html' %}

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Modals -->
    {% include 'components/modals.html' %}

    <!-- JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="/static/js/nexus-flow.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/navigation.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/connections.js"></script>
    <script src="/static/js/agents.js"></script>

    <!-- Theme toggle logic -->
    <script>
        function _applyThemeUI(theme) {
            var icon  = document.getElementById('themeIcon');
            var label = document.getElementById('themeLabel');
            if (icon)  icon.className  = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            if (label) label.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
        }

        function mxToggleTheme() {
            var html    = document.documentElement;
            var current = html.getAttribute('data-theme') || 'light';
            var next    = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            html.setAttribute('data-bs-theme', next === 'dark' ? 'dark' : 'light');
            localStorage.setItem('mx-theme', next);
            _applyThemeUI(next);
        }

        // Set correct icon + label on page load
        document.addEventListener('DOMContentLoaded', function () {
            _applyThemeUI(localStorage.getItem('mx-theme') || 'light');
        });
    </script>

    <!-- Prevent Chrome from autofilling search/filter inputs with saved credentials -->
    <script>
        (function () {
            var SEARCH_SELECTOR = [
                'input[type="search"]',
                'input[id*="search" i]',
                'input[id*="filter" i]',
                'input[id*="query" i]',
                'input[placeholder*="search" i]',
                'input[placeholder*="filter" i]'
            ].join(',');

            function applyNoAutofill(root) {
                (root || document).querySelectorAll(SEARCH_SELECTOR).forEach(function (el) {
                    if (el.dataset.mxNoFill) return;
                    el.dataset.mxNoFill = '1';
                    el.setAttribute('autocomplete', 'off');
                });
            }

            function clearInjectedEmails() {
                document.querySelectorAll(SEARCH_SELECTOR).forEach(function (el) {
                    if (el.value && el.value.indexOf('@') !== -1) el.value = '';
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                applyNoAutofill();
                // Chrome sometimes injects values after DOMContentLoaded
                setTimeout(clearInjectedEmails, 200);
                setTimeout(clearInjectedEmails, 800);

                // Handle inputs added dynamically (modals, lazy sections)
                if (window.MutationObserver) {
                    new MutationObserver(function (mutations) {
                        mutations.forEach(function (m) {
                            m.addedNodes.forEach(function (node) {
                                if (node.nodeType === 1) {
                                    applyNoAutofill(node.matches && node.matches(SEARCH_SELECTOR) ? node.parentElement : node);
                                }
                            });
                        });
                    }).observe(document.body, { childList: true, subtree: true });
                }
            });
        })();
    </script>

    {% block extra_js %}
    <script>
        console.log("Bootstrap:", bootstrap);
    </script>{% endblock %}
</body>

</html>
